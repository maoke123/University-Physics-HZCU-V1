<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁畴原理演示 - 增强版</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        h2 { margin-top: 0; color: #2c3e50; font-size: 22px; }

        canvas {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin: 15px 0;
            /* cursor: crosshair; */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.03);
            touch-action: none;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 20px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .control-group label {
            width: 100px;
            font-weight: bold;
            font-size: 14px;
            text-align: left;
        }

        /* 自定义滑块样式 */
        input[type=range] {
            flex-grow: 1;
            cursor: pointer;
            height: 6px;
            background: #ddd;
            border-radius: 5px;
            appearance: none;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            background: #3498db;
            border-radius: 50%;
            cursor: pointer;
            transition: background .15s ease-in-out;
        }
        input[type=range]::-webkit-slider-thumb:hover { background: #2980b9; }

        select {
            flex-grow: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            background-color: white;
        }

        /* 数字输入框样式 */
        input[type=number] {
            width: 70px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }

        .status-panel {
            margin-top: 15px;
            font-size: 13px;
            color: #555;
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .status-item span {
            font-weight: bold;
            color: #d35400;
        }

        .legend {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }

        /* 状态指示灯 */
        .state-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .state-ferro { background-color: #27ae60; box-shadow: 0 0 6px #27ae60;}
        .state-para { background-color: #e74c3c; box-shadow: 0 0 6px #e74c3c;}
        .state-none { background-color: #95a5a6; }

    </style>
</head>
<body>

<div class="container">
    <h2>磁畴微观变化模拟器</h2>
    
    <canvas id="domainCanvas" width="550" height="320"></canvas>
    
    <div class="status-panel">
        <div class="status-item">当前状态: <span id="magState">铁磁性</span></div>
        <div class="status-item">当前温度: <span id="currentTempDisplay">20°C</span></div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="materialSelect">材料选择:</label>
            <select id="materialSelect">
                </select>
        </div>

        <div class="control-group">
            <label>外磁场 (B):</label>
            <span style="font-size:12px; color:#666;">← N极</span>
            <input type="range" id="fieldSlider" min="-100" max="100" value="0">
            <span style="font-size:12px; color:#666;">S极 →</span>
        </div>

        <div class="control-group">
            <label>温度 (°C):</label>
            <input type="range" id="tempSlider" min="-50" max="1300" value="20">
            <input type="number" id="tempInput" min="-50" max="1300" value="20">
        </div>
    </div>
    <div class="legend">提示：试着选择"钆"，并将温度调至20°C以上，观察其快速失去磁性。</div>
</div>

<script>
    const canvas = document.getElementById('domainCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI 元素
    const fieldSlider = document.getElementById('fieldSlider');
    const tempSlider = document.getElementById('tempSlider');
    const tempInput = document.getElementById('tempInput');
    const materialSelect = document.getElementById('materialSelect');
    const magStateDisplay = document.getElementById('magState');
    const currentTempDisplay = document.getElementById('currentTempDisplay');

    // 模拟参数
    const cols = 18;
    const rows = 10;
    const cellWidth = canvas.width / cols;
    const cellHeight = canvas.height / rows;
    
    // 材质数据 (包含 居里点 Tc 和 相对磁导率 mu_r)
    // sensitivity 用于模拟不同材料磁畴转动的难易程度 (mu 越高越容易)
    const materialsData = [
        { id: 'iron', name: '铁 (Iron)', curie: 770, mu: '~5000', type: 'ferro', sensitivity: 1.0 },
        { id: 'cobalt', name: '钴 (Cobalt)', curie: 1115, mu: '~250', type: 'ferro', sensitivity: 0.6 }, // 钴较"硬"
        { id: 'nickel', name: '镍 (Nickel)', curie: 358, mu: '~600', type: 'ferro', sensitivity: 0.8 },
        { id: 'gadolinium', name: '钆 (Gadolinium)', curie: 20, mu: 'Var', type: 'ferro', sensitivity: 0.9 }, // 居里点极低
        { id: 'copper', name: '铜 (Copper)', curie: 0, mu: '0.99', type: 'dia', sensitivity: 0 },
        { id: 'aluminum', name: '铝 (Aluminum)', curie: 0, mu: '1.00002', type: 'para', sensitivity: 0 }
    ];

    // 初始化下拉菜单
    materialsData.forEach(m => {
        const option = document.createElement('option');
        option.value = m.id;
        // 格式化文本：材料名 (Tc: xxx, μr: xxx)
        const info = m.type === 'ferro' 
            ? `(Tc: ${m.curie}°C, μr: ${m.mu})` 
            : `(非磁性/顺磁性)`;
        option.text = `${m.name} ${info}`;
        materialSelect.appendChild(option);
    });

    let currentMaterial = materialsData[0]; // 默认铁
    let domains = [];

    // 初始化磁畴
    function initDomains() {
        domains = [];
        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                // 每个磁畴的晶格易磁化方向 (随机分布)
                const preferredAngle = Math.random() * Math.PI * 2;
                domains.push({
                    x: i * cellWidth + cellWidth / 2,
                    y: j * cellHeight + cellHeight / 2,
                    angle: preferredAngle,       
                    preferredAngle: preferredAngle, 
                    // 颜色偏移，制造颗粒感
                    colorOffset: Math.random() * 40 - 20
                });
            }
        }
    }

    // 绘制箭头函数
    function drawArrow(ctx, x, y, angle, length, color, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.globalAlpha = alpha;
        
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';

        // 箭身
        ctx.beginPath();
        ctx.moveTo(-length / 2, 0);
        ctx.lineTo(length / 2, 0);
        ctx.stroke();

        // 箭头头部
        ctx.beginPath();
        ctx.moveTo(length / 2, 0);
        ctx.lineTo(length / 2 - 5, -3.5);
        ctx.lineTo(length / 2 - 5, 3.5);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    // 主动画循环
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 获取当前输入
        const externalField = parseInt(fieldSlider.value); // -100 ~ 100
        const temperature = parseInt(tempInput.value); // 使用输入框的值作为真实值
        
        currentTempDisplay.innerText = temperature + "°C";

        // 1. 判断物理相变状态
        let isFerroMagnetic = false;
        
        if (currentMaterial.type === 'ferro') {
            if (temperature < currentMaterial.curie) {
                isFerroMagnetic = true;
                magStateDisplay.innerHTML = `<span class="state-indicator state-ferro"></span>铁磁性 (磁畴存在)`;
            } else {
                magStateDisplay.innerHTML = `<span class="state-indicator state-para"></span>顺磁性 (温度过高)`;
            }
        } else {
            magStateDisplay.innerHTML = `<span class="state-indicator state-none"></span>非/弱磁性`;
        }

        // 2. 遍历计算每个磁畴
        domains.forEach(d => {
            let targetAngle = d.angle;
            let noiseMagnitude = 0;
            const fieldStrength = Math.abs(externalField) / 100; // 0 ~ 1

            // A. 非磁性材料 (铜/铝)
            if (currentMaterial.type !== 'ferro') {
                // 表现为完全无序，轻微热震动
                d.angle += (Math.random() - 0.5) * 0.8; 
                // 颜色淡化
                drawArrow(ctx, d.x, d.y, d.angle, 10, '#bdc3c7', 0.4);
                return;
            }

            // B. 铁磁性材料处理
            if (!isFerroMagnetic) {
                // [超过居里点]：高温破坏了磁畴有序性
                // 表现：即使有外磁场，也主要是剧烈的随机热运动
                // 实际上顺磁性也会受磁场影响，但在宏观演示中，这种定向极弱，主要展示为混乱
                noiseMagnitude = 1.5; // 剧烈抖动
                d.angle += (Math.random() - 0.5) * noiseMagnitude;
                
                // 视觉上变红/灰表示高温混乱
                drawArrow(ctx, d.x, d.y, d.angle, 14, '#e74c3c', 0.7);

            } else {
                // [低于居里点]：铁磁状态
                
                // 计算"热扰动"：温度越接近居里点，扰动越大
                // 这是一个归一化的温度因子 0 ~ 1
                let thermalRatio = Math.max(0, temperature + 50) / (currentMaterial.curie + 50);
                noiseMagnitude = (Math.random() - 0.5) * thermalRatio * 0.4;

                // 目标方向逻辑
                if (fieldStrength < 0.05) {
                    // 无外磁场：回归易磁化轴 (自发磁化)
                    targetAngle = d.preferredAngle;
                } else {
                    // 有外磁场：趋向磁场方向
                    const fieldDir = externalField > 0 ? 0 : Math.PI;
                    targetAngle = fieldDir;
                }

                // 旋转速度逻辑 (Lerp)
                // 速度 = 基础速度 * 场强 * 材料灵敏度
                // 即使磁场很强，如果温度很高，对齐也会变难(这里通过 noise 抵消一部分)
                let speed = (0.05 + fieldStrength * 0.15) * currentMaterial.sensitivity;
                
                // 角度插值计算
                let diff = targetAngle - d.angle;
                // 修正 -PI 到 PI 的跳跃
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                
                d.angle += diff * speed + noiseMagnitude;

                // 绘制
                // 颜色：基于角度的细微变化 + 材料基色
                // 越整齐颜色越深
                const isAligned = Math.abs(diff) < 0.5;
                const baseColor = isAligned ? "#2c3e50" : "#34495e";
                
                drawArrow(ctx, d.x, d.y, d.angle, 20, baseColor, 1.0);
            }
        });

        // 绘制网格背景 (模拟晶粒)
        ctx.strokeStyle = "rgba(0,0,0,0.06)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=1; i<cols; i++) {
            ctx.moveTo(i*cellWidth, 0); i*cellWidth, canvas.height
            ctx.lineTo(i*cellWidth, canvas.height);
        }
        for(let j=1; j<rows; j++) {
            ctx.moveTo(0, j*cellHeight);
            ctx.lineTo(canvas.width, j*cellHeight);
        }
        ctx.stroke();

        requestAnimationFrame(animate);
    }

    // --- 事件监听处理 ---

    // 1. 材料改变
    materialSelect.addEventListener('change', (e) => {
        const selectedId = e.target.value;
        currentMaterial = materialsData.find(m => m.id === selectedId);
        
        // 重置/调整逻辑
        if(currentMaterial.type !== 'ferro') {
             fieldSlider.disabled = true; // 非磁性不受磁场控制(演示简化)
             fieldSlider.style.opacity = "0.5";
        } else {
             fieldSlider.disabled = false;
             fieldSlider.style.opacity = "1";
        }
        // 如果切到钆，如果不重置温度，用户可能看不到效果，但保留温度更真实
        // 这里不做特殊处理，让用户自己调节
    });

    // 2. 温度滑块与输入框同步
    tempSlider.addEventListener('input', (e) => {
        tempInput.value = e.target.value;
    });

    tempInput.addEventListener('input', (e) => {
        let val = parseInt(e.target.value);
        // 限制输入范围
        if (val > 1300) val = 1300;
        if (val < -50) val = -50;
        tempSlider.value = val;
    });

    // 3. 启动
    initDomains();
    animate();

</script>

</body>
</html>
