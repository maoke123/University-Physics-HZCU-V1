<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>电磁感应实时监控模型</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f7f6; color: #333; }
        .container { display: flex; gap: 20px; margin-top: 20px; }
        canvas { background: white; border: 1px solid #ccc; border-radius: 4px; }
        .controls { width: 300px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .data-panel { margin-top: 15px; padding: 10px; background: #eef; border-left: 4px solid #007bff; }
        .value { font-family: monospace; font-weight: bold; color: #d9534f; }
        input[type="range"] { width: 100%; }
    </style>
</head>
<body>

    <h2>矩形回路感应电动势实时模拟</h2>

    <div class="container">
        <canvas id="canvas" width="600" height="400"></canvas>
        
        <div class="controls">
            <label>距离 <b>d</b>: <span id="dVal">50</span> px</label>
            <input type="range" id="distRange" min="10" max="250" value="50">
            
            <div class="data-panel">
                <div>当前电流 I: <span id="iVal" class="value">0.00</span> A</div>
                <div>感应电动势 ε: <span id="eVal" class="value">0.00</span> V</div>
            </div>
            <p style="font-size: 12px; color: #666; margin-top:10px;">
                提示：当距离 <b>d</b> 越小时，磁场梯度越大，感应电动势的峰值越明显。
            </p>
        </div>
    </div>

    <canvas id="chartCanvas" width="920" height="150" style="margin-top:20px;"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const chartCanvas = document.getElementById('chartCanvas');
    const cctx = chartCanvas.getContext('2d');
    
    const dInput = document.getElementById('distRange');
    const dValText = document.getElementById('dVal');
    const iValText = document.getElementById('iVal');
    const eValText = document.getElementById('eVal');

    // 物理参数
    let d = parseInt(dInput.value);
    const a = 100; // 回路宽度
    const b = 150; // 回路高度
    let time = 0;
    let history = []; // 存储电动势数据用于绘图

    dInput.oninput = () => {
        d = parseInt(dInput.value);
        dValText.innerText = d;
    };

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const wireX = 80;
        
        // 1. 计算物理量
        const omega = 2; // 角速度
        const I = Math.sin(omega * time);
        // 计算电动势 ε ∝ ln((d+a)/d) * cos(omega * t)
        const emf = -Math.log((d + a) / d) * Math.cos(omega * time) * 50; 

        // 更新文本
        iValText.innerText = I.toFixed(2);
        eValText.innerText = emf.toFixed(2);

        // 2. 绘制长直导线
        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#222";
        ctx.moveTo(wireX, 20);
        ctx.lineTo(wireX, 380);
        ctx.stroke();

        // 3. 绘制矩形回路 (位置随 d 变化)
        const rectX = wireX + d;
        const rectY = 125;
        ctx.lineWidth = 3;
        ctx.strokeStyle = emf > 0 ? '#ff4d4d' : '#4d79ff';
        ctx.strokeRect(rectX, rectY, a, b);
        
        // 填充半透明色表示感应强度
        ctx.fillStyle = emf > 0 ? 'rgba(255, 77, 77, 0.1)' : 'rgba(77, 121, 255, 0.1)';
        ctx.fillRect(rectX, rectY, a, b);

        // 4. 绘制实时波形图
        drawChart(emf);

        time += 0.02;
        requestAnimationFrame(draw);
    }

    function drawChart(currentEmf) {
        cctx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);
        history.push(currentEmf);
        if (history.length > 450) history.shift();

        cctx.beginPath();
        cctx.strokeStyle = '#007bff';
        cctx.lineWidth = 2;
        for (let i = 0; i < history.length; i++) {
            const x = i * 2;
            const y = 75 - history[i]; // 基准线在中间
            if (i === 0) cctx.moveTo(x, y);
            else cctx.lineTo(x, y);
        }
        cctx.stroke();

        // 中线
        cctx.setLineDash([5, 5]);
        cctx.strokeStyle = '#ccc';
        cctx.beginPath();
        cctx.moveTo(0, 75); cctx.lineTo(chartCanvas.width, 75);
        cctx.stroke();
        cctx.setLineDash([]);
        cctx.fillStyle = "#999";
        cctx.fillText("感应电动势实时波形 (ε)", 10, 20);
    }

    draw();
</script>
</body>
</html>
