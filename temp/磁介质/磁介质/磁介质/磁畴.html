<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁畴与居里温度交互演示</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h2 { margin-top: 0; color: #2c3e50; }

        canvas {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin: 10px 0;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .control-group label {
            width: 80px;
            font-weight: bold;
            font-size: 14px;
        }

        input[type=range] {
            flex-grow: 1;
            cursor: pointer;
        }

        select {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .status-panel {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
            display: flex;
            justify-content: space-around;
        }

        .status-item span {
            font-weight: bold;
            color: #d35400;
        }

        .legend {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* 状态指示灯 */
        .state-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .state-ferro { background-color: #27ae60; box-shadow: 0 0 5px #27ae60;}
        .state-para { background-color: #c0392b; box-shadow: 0 0 5px #c0392b;}
        .state-none { background-color: #7f8c8d; }

    </style>
</head>
<body>

<div class="container">
    <h2>磁畴微观模拟 (Magnetic Domains)</h2>
    
    <canvas id="domainCanvas" width="500" height="300"></canvas>
    
    <div class="status-panel">
        <div class="status-item">状态: <span id="magState">铁磁性</span></div>
        <div class="status-item">居里点: <span id="curiePointDisplay">770°C</span></div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="materialSelect">材质:</label>
            <select id="materialSelect">
                <option value="iron">铁 (Iron) - 强磁性</option>
                <option value="nickel">镍 (Nickel) - 中磁性</option>
                <option value="copper">铜 (Copper) - 无磁畴</option>
            </select>
        </div>

        <div class="control-group">
            <label>外磁场 (B):</label>
            <span style="font-size:12px;">← N极</span>
            <input type="range" id="fieldSlider" min="-100" max="100" value="0">
            <span style="font-size:12px;">S极 →</span>
        </div>

        <div class="control-group">
            <label>温度 (T):</label>
            <input type="range" id="tempSlider" min="20" max="1000" value="20">
            <span id="tempValue" style="width: 50px; text-align: right;">20°C</span>
        </div>
    </div>
    <div class="legend">提示：左右拖动"外磁场"改变磁场方向；升高"温度"观察热运动破坏磁畴。</div>
</div>

<script>
    const canvas = document.getElementById('domainCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI 元素
    const fieldSlider = document.getElementById('fieldSlider');
    const tempSlider = document.getElementById('tempSlider');
    const tempValueDisplay = document.getElementById('tempValue');
    const materialSelect = document.getElementById('materialSelect');
    const curieDisplay = document.getElementById('curiePointDisplay');
    const magStateDisplay = document.getElementById('magState');

    // 模拟参数
    const cols = 15;
    const rows = 10;
    const cellWidth = canvas.width / cols;
    const cellHeight = canvas.height / rows;
    
    // 材质属性数据库
    const materials = {
        iron: { name: '铁', curie: 770, type: 'ferro', sensitivity: 0.1 },
        nickel: { name: '镍', curie: 358, type: 'ferro', sensitivity: 0.15 }, // 镍更灵敏因为更容易饱和，但这里主要用居里点区分
        copper: { name: '铜', curie: 0, type: 'non-mag', sensitivity: 0 }
    };

    let currentMaterial = materials.iron;
    let domains = [];

    // 初始化磁畴网格
    function initDomains() {
        domains = [];
        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                // 每个磁畴有一个“优选方向” (Crystal Axis)，模拟多晶体结构
                // 在没有外磁场时，它们倾向于指向这个方向
                const preferredAngle = Math.random() * Math.PI * 2;
                
                domains.push({
                    x: i * cellWidth + cellWidth / 2,
                    y: j * cellHeight + cellHeight / 2,
                    angle: preferredAngle,       // 当前实际角度
                    preferredAngle: preferredAngle, // 晶格易磁化轴
                    colorHue: Math.random() * 60 + 200 // 蓝色系，用于视觉区分不同区域
                });
            }
        }
    }

    // 绘制箭头
    function drawArrow(ctx, x, y, angle, length, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';

        // 箭身
        ctx.beginPath();
        ctx.moveTo(-length / 2, 0);
        ctx.lineTo(length / 2, 0);
        ctx.stroke();

        // 箭头
        ctx.beginPath();
        ctx.moveTo(length / 2, 0);
        ctx.lineTo(length / 2 - 6, -4);
        ctx.lineTo(length / 2 - 6, 4);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    // 主循环
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 获取当前输入值
        const externalField = parseInt(fieldSlider.value); // -100 to 100
        const temperature = parseInt(tempSlider.value);
        
        // 更新UI数值
        tempValueDisplay.innerText = temperature + "°C";

        // 判断物理状态
        let isAboveCurie = false;
        if (currentMaterial.type === 'ferro') {
            if (temperature > currentMaterial.curie) {
                isAboveCurie = true;
                magStateDisplay.innerHTML = `<span class="state-indicator state-para"></span>顺磁性 (相变)`;
            } else {
                magStateDisplay.innerHTML = `<span class="state-indicator state-ferro"></span>铁磁性 (有序)`;
            }
        } else {
            magStateDisplay.innerHTML = `<span class="state-indicator state-none"></span>无磁畴 (非磁性)`;
        }

        // 计算物理逻辑
        domains.forEach(d => {
            let targetAngle;
            let noise = 0;
            const fieldStrength = Math.abs(externalField) / 100;
            
            // 1. 铜/非磁性材质处理
            if (currentMaterial.type === 'non-mag') {
                // 铜内部没有磁畴，电子自旋杂乱或抵消。我们表现为完全随机且对外场不敏感
                // 为了视觉效果，我们让它们转得很快，表示无序
                d.angle += (Math.random() - 0.5) * 0.5; 
                const alpha = 0.3; // 变淡，表示没有强磁性
                drawArrow(ctx, d.x, d.y, d.angle, 10, `rgba(150, 150, 150, ${alpha})`);
                return; 
            }

            // 2. 铁/镍 处理
            if (isAboveCurie) {
                // 超过居里点：热骚动占主导，外磁场很难对齐它们
                // 目标角度完全随机
                noise = (Math.random() - 0.5) * 2; // 剧烈抖动
                // 即使有强磁场，顺磁性效应也很弱，这里为了视觉简化，主要表现为随机
                d.angle += noise;
            } else {
                // 低于居里点：铁磁性状态
                
                // 计算热噪声幅度 (温度越高，抖动越大)
                const thermalAgitation = (temperature / currentMaterial.curie) * 0.2;
                noise = (Math.random() - 0.5) * thermalAgitation;

                if (fieldStrength < 0.05) {
                    // 弱磁场/无磁场：磁畴回归到晶格易磁化轴 (自发磁化)
                    // 这是书中提到的 "无外磁场...排列方向杂乱"
                    targetAngle = d.preferredAngle;
                } else {
                    // 强磁场：磁畴转向外磁场方向
                    // externalField > 0 (向右) -> angle 0
                    // externalField < 0 (向左) -> angle PI
                    const fieldDir = externalField > 0 ? 0 : Math.PI;
                    targetAngle = fieldDir;
                }

                // 动画平滑过渡 (Lerp)
                // 磁场越强，对齐速度越快
                let speed = 0.05 + fieldStrength * 0.1; 
                
                // 角度插值处理 (处理 0 和 2PI 的突变)
                let diff = targetAngle - d.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                
                d.angle += diff * speed + noise;
            }

            // 绘制
            // 颜色随方向轻微变化，增强视觉美感
            const color = isAboveCurie ? "#95a5a6" : "#34495e";
            drawArrow(ctx, d.x, d.y, d.angle, 20, color);
        });

        // 绘制简单的背景网格线，模拟晶粒边界
        ctx.strokeStyle = "rgba(0,0,0,0.05)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=1; i<cols; i++) {
            ctx.moveTo(i*cellWidth, 0);
            ctx.lineTo(i*cellWidth, canvas.height);
        }
        for(let j=1; j<rows; j++) {
            ctx.moveTo(0, j*cellHeight);
            ctx.lineTo(canvas.width, j*cellHeight);
        }
        ctx.stroke();

        requestAnimationFrame(animate);
    }

    // 事件监听
    materialSelect.addEventListener('change', (e) => {
        currentMaterial = materials[e.target.value];
        curieDisplay.innerText = currentMaterial.curie > 0 ? currentMaterial.curie + "°C" : "无";
        // 重置状态
        if(currentMaterial.type === 'non-mag') {
             fieldSlider.disabled = true;
        } else {
             fieldSlider.disabled = false;
        }
    });

    // 启动
    initDomains();
    animate();

</script>

</body>
</html>
