<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 火箭质心运动演示 - 最终稳定版</title>
    <style>
        body { margin: 0; background: #ffffff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #overlay {
            position: absolute; top: 20px; width: 100%; text-align: center; color: #333;
            pointer-events: none; z-index: 100;
        }
        .ui-panel { position: absolute; bottom: 40px; width: 100%; text-align: center; z-index: 100; }
        button {
            padding: 15px 40px; font-size: 18px; cursor: pointer; background: #2c3e50;
            color: white; border: none; border-radius: 4px; font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); transition: 0.3s;
        }
        button:hover { background: #34495e; transform: scale(1.05); }
        .status { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>火箭动力学：一体化飞行与同向分离</h2>
        <p>🟡 荧光质心 (CM) | 🔴 红色虚线：系统总路径</p>
        <p>当前状态：<span id="status" class="status">待命</span></p>
    </div>

    <div class="ui-panel">
        <button onclick="startMission()">发射并观察分离</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 核心初始化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(-80, 50, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(40, 25, 0);

        // --- 环境光 ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(20, 100, 50);
        sun.castShadow = true;
        scene.add(sun);

        // 地面与网格
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({color: 0xfafafa}));
        ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
        scene.add(ground);
        scene.add(new THREE.GridHelper(600, 60, 0xdddddd, 0xeeeeee));

        // --- 火箭构造 (一体化节点) ---
        const matLower = new THREE.MeshStandardMaterial({color: 0x95a5a6}); // 灰色下级
        const matUpper = new THREE.MeshStandardMaterial({color: 0x2980b9}); // 蓝色上级
        
        const stage1 = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1, 6, 24), matLower);
        const stage2 = new THREE.Group();
        const s2Body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 5, 24), matUpper);
        const s2Nose = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 24), matUpper);
        s2Nose.position.y = 3.25; 
        stage2.add(s2Body, s2Nose);

        // 轨迹线：红(质心), 蓝(上级), 灰(下级)
        const createPath = (col) => new THREE.Line(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({color: col, dashSize: 0.8, gapSize: 0.4}));
        const lineCM = createPath(0xe74c3c);
        const lineS1 = createPath(0x7f8c8d);
        const lineS2 = createPath(0x3498db);
        scene.add(lineCM, lineS1, lineS2);

        // 荧光质心小球
        const cmGroup = new THREE.Group();
        const cmBall = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), new THREE.MeshBasicMaterial({color: 0xffff00}));
        const cmLight = new THREE.PointLight(0xffff00, 5, 12);
        cmGroup.add(cmBall, cmLight);
        scene.add(cmGroup);

        // --- 动力学控制 ---
        let mode = "IDLE", t = 0;
        const v0 = 36, angle = Math.PI / 3.2, g = 9.8, startX = -80;
        const sepT = 2.5; // 分离时间点
        const dv = 7;    // 分离推力
        let pCM = [], pS1 = [], pS2 = [];

        window.startMission = () => {
            mode = "WHOLE"; t = 0; pCM = []; pS1 = []; pS2 = [];
            scene.add(stage1); scene.add(stage2);
            document.getElementById('status').innerText = "一体化推进中...";
        };

        function animate() {
            requestAnimationFrame(animate);
            if (mode === "WHOLE" || mode === "SEPARATED") {
                t += 0.016;
                // 系统总质心位置 (标准抛物线)
                const cx = startX + v0 * Math.cos(angle) * t;
                const cy = 3 + (v0 * Math.sin(angle) * t - 0.5 * g * t * t);
                cmGroup.position.set(cx, cy, 0);
                pCM.push(new THREE.Vector3(cx, cy, 0));
                lineCM.geometry.setFromPoints(pCM); lineCM.computeLineDistances();

                const vx0 = v0 * Math.cos(angle);
                const vy_t = v0 * Math.sin(angle) - g * t;

                if (mode === "WHOLE") {
                    // --- 一体化飞行逻辑 ---
                    const rot = Math.atan2(vy_t, vx0) - Math.PI/2;
                    // 两级火箭根据质心位置严丝合缝对齐
                    stage1.position.set(cx - 2.8 * Math.cos(rot+Math.PI/2), cy - 2.8 * Math.sin(rot+Math.PI/2), 0);
                    stage1.rotation.z = rot;
                    stage2.position.set(cx + 2.7 * Math.cos(rot+Math.PI/2), cy + 2.7 * Math.sin(rot+Math.PI/2), 0);
                    stage2.rotation.z = rot;
                    
                    if (t >= sepT) { 
                        mode = "SEPARATED"; 
                        document.getElementById('status').innerText = "执行同向分离：上级加速/下级减速";
                    }
                } else {
                    // --- 分离后的多轨动力学 ---
                    const dtS = t - sepT;
                    const vy_sep = v0 * Math.sin(angle) - g * sepT;
                    const sAngle = Math.atan2(vy_sep, vx0);
                    
                    // 内力导致的同向速度偏差
                    const dvx = dv * Math.cos(sAngle), dvy = dv * Math.sin(sAngle);

                    // 上级：初速 + 增量
                    const s2x = startX + vx0 * sepT + (vx0 + dvx) * dtS;
                    const s2y = 3 + (v0 * Math.sin(angle) * sepT - 0.5 * g * sepT * sepT) + (vy_sep + dvy) * dtS - 0.5 * g * dtS * dtS;
                    stage2.position.set(s2x + 2.7 * Math.cos(sAngle+Math.PI/2), s2y + 2.7 * Math.sin(sAngle+Math.PI/2), 0);
                    stage2.rotation.z = Math.atan2((vy_sep+dvy)-g*dtS, vx0+dvx) - Math.PI/2;
                    pS2.push(new THREE.Vector3(s2x, s2y, 0));
                    lineS2.geometry.setFromPoints(pS2); lineS2.computeLineDistances();

                    // 下级：初速 - 增量
                    const s1x = startX + vx0 * sepT + (vx0 - dvx) * dtS;
                    const s1y = 3 + (v0 * Math.sin(angle) * sepT - 0.5 * g * sepT * sepT) + (vy_sep - dvy) * dtS - 0.5 * g * dtS * dtS;
                    stage1.position.set(s1x - 2.8 * Math.cos(sAngle+Math.PI/2), s1y - 2.8 * Math.sin(sAngle+Math.PI/2), 0);
                    stage1.rotation.z = Math.atan2((vy_sep-dvy)-g*dtS, vx0-dvx) - Math.PI/2;
                    pS1.push(new THREE.Vector3(s1x, s1y, 0));
                    lineS1.geometry.setFromPoints(pS1); lineS1.computeLineDistances();
                }
                if (cy < -20) mode = "IDLE";
            }
            controls.update(); renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
