<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>刚体转动惯量交互演示 - 教材同步版</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --primary: #3498db; --bg: #f8f9fa; }
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); overflow: hidden; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; width: 320px;
            background: rgba(255, 255, 255, 0.95); padding: 25px;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 100; backdrop-filter: blur(5px);
        }
        h2 { margin: 0 0 15px 0; font-size: 1.25rem; color: #2c3e50; border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
        .control-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #7f8c8d; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; background: white; font-size: 1rem; cursor: pointer; }
        #formula-box { margin: 20px 0; padding: 15px; background: #f1f7ff; border-radius: 8px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; }
        .description { font-size: 0.9rem; line-height: 1.6; color: #444; margin-bottom: 20px; height: 60px; }
        .stats { font-size: 0.8rem; color: #95a5a6; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div id="ui-panel">
    <h2>刚体转动惯量演示</h2>
    <div class="control-group">
        <label>选择刚体形状</label>
        <select id="shapeSelect">
            <optgroup label="柱体类">
                <option value="hollowCylinder">薄圆筒 (绕轴线)</option>
                <option value="cylinder">实心圆柱</option>
            </optgroup>
            <optgroup label="球体类">
                <option value="sphereSolid">实心球</option>
                <option value="sphereHollow">空心球壳</option>
            </optgroup>
            <optgroup label="细杆类">
                <option value="rodCenter">均匀细长杆 (绕中点)</option>
                <option value="rodEnd">均匀细长杆 (绕端点)</option>
            </optgroup>
        </select>
    </div>
    <div id="formula-box"></div>
    <div class="description" id="descText">载入物理模型中...</div>
    <div class="stats">
        <span>旋转轴：红色虚线</span>
        <span>状态：定轴转动模拟</span>
    </div>
</div>

<script>
    const physicsData = {
        hollowCylinder: {
            name: "薄圆筒",
            formula: "I = mR^2",
            desc: "所有质量分布在半径 R 处。转动惯量系数最大，在相同力矩下启动最慢。",
            speedMult: 0.7,
            create: () => {
                const geo = new THREE.CylinderGeometry(1.2, 1.2, 2.5, 48, 1, true);
                return geo;
            }
        },
        cylinder: {
            name: "实心圆柱",
            formula: "I = \\frac{1}{2}mR^2",
            desc: "质量均匀分布在轴心到半径 R 之间。转动惯量系数为 0.5。",
            speedMult: 1.2,
            create: () => new THREE.CylinderGeometry(1.2, 1.2, 2.5, 48)
        },
        sphereSolid: {
            name: "实心球",
            formula: "I = \\frac{2}{5}mR^2",
            desc: "质量向轴中心集中，转动惯量系数为 0.4。",
            speedMult: 1.6,
            create: () => new THREE.SphereGeometry(1.2, 32, 32)
        },
        sphereHollow: {
            name: "空心球",
            formula: "I = \\frac{2}{3}mR^2",
            desc: "质量分布在薄球壳表面。转动惯量系数为 0.67。",
            speedMult: 1.0,
            create: () => new THREE.SphereGeometry(1.2, 32, 32),
            wireframe: true
        },
        rodCenter: {
            name: "细杆(中点)",
            formula: "I = \\frac{1}{12}mL^2",
            desc: "绕质心转动。转速极快，系数约为 0.083。",
            speedMult: 2.5,
            create: () => {
                const geo = new THREE.CylinderGeometry(0.05, 0.05, 3.5, 32);
                geo.rotateZ(Math.PI / 2);
                return geo;
            }
        },
        rodEnd: {
            name: "细杆(端点)",
            formula: "I = \\frac{1}{3}mL^2",
            desc: "绕端点转动。惯量是绕中点时的 4 倍，转速显著变慢。",
            speedMult: 0.8,
            create: () => {
                const geo = new THREE.CylinderGeometry(0.05, 0.05, 3.5, 32);
                geo.translate(0, 1.75, 0); 
                geo.rotateZ(Math.PI / 2);
                return geo;
            }
        }
    };

    // --- Three.js 初始化 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8f9fa);
    
    // 增加雾化效果，让远处的地面自然过渡
    scene.fog = new THREE.Fog(0xf8f9fa, 10, 30);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    
    // 开启渲染器阴影
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- 环境光与平行光 ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    
    // 开启平行光阴影并调整参数
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 25;
    dirLight.shadow.camera.left = -5;
    dirLight.shadow.camera.right = 5;
    dirLight.shadow.camera.top = 5;
    dirLight.shadow.camera.bottom = -5;
    dirLight.shadow.bias = -0.001; // 解决阴影表面条纹问题
    scene.add(dirLight);

    // --- 添加地面和网格 ---
    const planeGeometry = new THREE.PlaneGeometry(50, 50);
    const planeMaterial = new THREE.MeshPhongMaterial({ 
        color: 0xeeeeee, 
        depthWrite: false // 让网格线更好显示
    });
    const plane = new THREE.Mesh(planeGeometry, planeMaterial);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = -2.5; // 与转轴底端对齐
    plane.receiveShadow = true; // 接收阴影
    scene.add(plane);

    const gridHelper = new THREE.GridHelper(50, 50, 0x000000, 0x000000);
    gridHelper.material.opacity = 0.1;
    gridHelper.material.transparent = true;
    gridHelper.position.y = -2.49; // 略微高于平面防止深度冲突
    scene.add(gridHelper);

    // --- 转轴 ---
    const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -2.5, 0), new THREE.Vector3(0, 3.5, 0)]);
    const axisMat = new THREE.LineDashedMaterial({ color: 0xff4757, dashSize: 0.2, gapSize: 0.1 });
    const axis = new THREE.Line(axisGeo, axisMat);
    axis.computeLineDistances();
    scene.add(axis);

    let currentMesh = null;
    let rotationSpeed = 0.02;

    function updateModel(id) {
        const data = physicsData[id];
        if (currentMesh) scene.remove(currentMesh);

        const geometry = data.create();
        const material = new THREE.MeshPhongMaterial({
            color: 0x3498db,
            transparent: true,
            opacity: 0.85,
            wireframe: data.wireframe || false,
            side: THREE.DoubleSide
        });

        currentMesh = new THREE.Mesh(geometry, material);
        // 让模型产生并接收阴影
        currentMesh.castShadow = true;
        currentMesh.receiveShadow = true;
        
        scene.add(currentMesh);

        katex.render(data.formula, document.getElementById('formula-box'));
        document.getElementById('descText').innerText = data.desc;
        rotationSpeed = 0.01 * data.speedMult;
    }

    camera.position.set(6, 5, 9); // 稍微调高视角，更好地展示阴影和地面
    camera.lookAt(0, 0, 0);

    function animate() {
        requestAnimationFrame(animate);
        if (currentMesh) currentMesh.rotation.y += rotationSpeed;
        renderer.render(scene, camera);
    }

    document.getElementById('shapeSelect').onchange = (e) => updateModel(e.target.value);
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = () => updateModel('hollowCylinder');
    animate();
</script>
</body>
</html>
