<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 动力学 - 前滚翻质心路径演示</title>
    <style>
        body { margin: 0; background: #ffffff; font-family: 'PingFang SC', sans-serif; overflow: hidden; }
        #info {
            position: absolute; top: 20px; width: 100%; text-align: center; color: #333;
            pointer-events: none; z-index: 100;
        }
        .controls { position: absolute; bottom: 40px; width: 100%; text-align: center; z-index: 100; }
        button {
            padding: 15px 50px; font-size: 18px; cursor: pointer; background: #27ae60;
            color: white; border: none; border-radius: 8px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s;
        }
        button:hover { background: #2ecc71; transform: translateY(-2px); }
        #status-text { font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>

    <div id="info">
        <h1>前滚翻：质心运动轨迹与转动分析</h1>
        <p>黄色发光小球体：<b>质心 (CM)</b> | 红色虚线：<b>质心抛物线路径</b></p>
        <p>状态：<span id="status-text">正立准备</span></p>
    </div>

    <div class="controls">
        <button onclick="startPhysicsAnimation()">开始翻滚演示</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 场景设置 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(-30, 15, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(15, 5, 0);

        // --- 灯光 ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 50, 20);
        light.castShadow = true;
        scene.add(light);

        // --- 地面 ---
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({color: 0xf8f8f8}));
        ground.rotation.x = -Math.PI/2;
        ground.receiveShadow = true;
        scene.add(ground);
        scene.add(new THREE.GridHelper(200, 50, 0xdddddd, 0xeeeeee));

        // --- 仿真人偶构造 ---
        function createAthlete() {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({color: 0xffdbac});
            const clothesMat = new THREE.MeshStandardMaterial({color: 0x2c3e50});

            // 质心锚点
            const cmPivot = new THREE.Group(); 
            group.add(cmPivot);

            // 核心躯干容器 (用于翻转)
            const bodyContent = new THREE.Group();
            cmPivot.add(bodyContent);

            const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 1.2, 4, 8), clothesMat);
            torso.position.y = 0.6; 
            bodyContent.add(torso);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), skinMat);
            head.position.y = 1.4;
            bodyContent.add(head);

            // 腿部与手臂 (简化骨骼)
            const createPart = (geo, mat, x, y, z) => {
                const m = new THREE.Mesh(geo, mat);
                m.position.set(x, y, z);
                m.castShadow = true;
                return m;
            };

            const legL = createPart(new THREE.CapsuleGeometry(0.2, 1.4, 4, 8), clothesMat, -0.35, -0.6, 0);
            const legR = createPart(new THREE.CapsuleGeometry(0.2, 1.4, 4, 8), clothesMat, 0.35, -0.6, 0);
            bodyContent.add(legL, legR);

            const armL = createPart(new THREE.CapsuleGeometry(0.12, 1.2, 4, 8), skinMat, -0.6, 0.8, 0);
            const armR = createPart(new THREE.CapsuleGeometry(0.12, 1.2, 4, 8), skinMat, 0.6, 0.8, 0);
            bodyContent.add(armL, armR);

            // --- 核心修改：更小发光的质心球 ---
            const cmGeometry = new THREE.SphereGeometry(0.3, 32, 32); // 尺寸显著缩小
            const cmMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffff00, 
                transparent: true,
                opacity: 0.9 // 微透明增强发光感
            });
            const cmBall = new THREE.Mesh(cmGeometry, cmMaterial);
            cmPivot.add(cmBall);

            // 添加一个黄色点光源模拟发光效果
            const cmLight = new THREE.PointLight(0xffff00, 3, 5); 
            cmPivot.add(cmLight);

            // 初始化位置修正：让人物脚底站在地面
            bodyContent.position.y = 0.2; 

            return { group, cmPivot, bodyContent, legL, legR, armL, armR, head, cmLight };
        }

        const athlete = createAthlete();
        scene.add(athlete.group);

        // --- 抛物线轨迹 ---
        const pathLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({color: 0xe74c3c, dashSize: 0.8, gapSize: 0.4, linewidth: 3}));
        scene.add(pathLine);
        let pathPoints = [];

        // --- 动画变量 ---
        let state = "IDLE";
        let t = 0;
        const v0 = 15;
        const angle = Math.PI / 4.5;
        const g = 8.0;
        const startX = -20;

        window.startPhysicsAnimation = () => {
            state = "PREP";
            t = 0;
            pathPoints = [];
            athlete.group.position.set(startX, 1.8, 0); // 回到起跳高度
            athlete.cmPivot.rotation.z = 0; // 重置旋转
            document.getElementById('status-text').innerText = "预备下蹲...";
        };

        function animate() {
            requestAnimationFrame(animate);
            const dt = 0.016;

            if (state === "PREP") {
                t += dt * 1.5;
                const p = Math.min(t, 1);
                // 蹲下准备，手臂后摆
                athlete.group.position.y = 1.8 - p * 1.0;
                athlete.armL.rotation.x = -p * 1.5;
                athlete.armR.rotation.x = -p * 1.5;
                if (t > 1.2) { state = "ROLL"; t = 0; }
            } 
            else if (state === "ROLL") {
                t += dt * 1.4;
                // 质心沿抛物线移动
                const x = startX + v0 * Math.cos(angle) * t;
                const y = 0.8 + (v0 * Math.sin(angle) * t - 0.5 * g * t * t);
                athlete.group.position.set(x, y, 0);

                // 绕质心翻转
                athlete.cmPivot.rotation.z = -t * Math.PI * 1.8;
                
                // 肢体团身动作
                const tuck = Math.sin(Math.min(t * 1.5, Math.PI));
                athlete.legL.rotation.x = tuck * 2;
                athlete.legR.rotation.x = tuck * 2;
                athlete.head.rotation.x = tuck * 1;

                // 记录抛物线路程
                pathPoints.push(new THREE.Vector3(x, y, 0));
                pathLine.geometry.setFromPoints(pathPoints);
                pathLine.computeLineDistances();

                if (y < 1.0 && t > 0.5) { state = "LAND"; t = 0; }
            }
            else if (state === "LAND") {
                t += dt * 2.5;
                const p = Math.min(t, 1);
                // 落地缓冲，站立正立
                athlete.group.position.y = 1.0 + p * 0.8;
                athlete.cmPivot.rotation.z = 0;
                athlete.legL.rotation.x *= (1-p);
                athlete.legR.rotation.x *= (1-p);
                athlete.head.rotation.x *= (1-p);
                if (t > 1) { 
                    state = "FINISH"; 
                    document.getElementById('status-text').innerText = "演示完毕 - 正立平衡";
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
