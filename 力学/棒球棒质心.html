<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>棒球棒长投</title>
    <style>
        body { margin: 0; background-color: #fcfcfc; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #111;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(255,255,255,0.9);
            z-index: 100;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 100;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            background: #2ecc71; /* 亮绿色按钮 */
            color: white;
            border: none;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        button:hover { background: #27ae60; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.25); }
        button:active { transform: translateY(0); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.8);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="info">
        <h2>棒球棒质心投掷</h2>
        <p>霓虹黄色球体即为**强化的质心 (CM)**。它始终沿红色粗虚线长抛物线移动。</p>
    </div>

    <div id="instructions">
        <b>操作说明：</b><br>
        • 拖动鼠标左键：旋转视角<br>
        • 滚动滚轮：缩放视角<br>
        • 拖动鼠标右键：平移视角
    </div>

    <div class="controls">
        <button onclick="resetAnimation()">用力投掷</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 场景初始化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfcfcfc);
        scene.fog = new THREE.Fog(0xfcfcfc, 40, 150); // 增强雾效

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-15, 20, 70); // 宏大视角
        camera.lookAt(30, 8, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- 交互式视角控制 (OrbitControls) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 200;
        controls.target.set(30, 8, 0);

        // --- 灯光 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
        directionalLight.position.set(20, 40, 25);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.near = 1;
        directionalLight.shadow.camera.far = 200;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 40;
        directionalLight.shadow.camera.bottom = -15;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // --- 地面 (超大型) ---
        const gridHelper = new THREE.GridHelper(200, 100, 0xbbbbbb, 0xdddddd);
        gridHelper.position.y = 0.02;
        scene.add(gridHelper);

        const groundGeometry = new THREE.PlaneGeometry(200, 200);
        const groundMaterial = new THREE.MeshPhongMaterial({ color: 0x909090, depthWrite: false });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- 棒球棒模型组 ---
        const baseballBatGroup = new THREE.Group();

        // 1. 创建自定义代码纹理 (木纹颜色渐变)
        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 64;
            const context = canvas.getContext('2d');
            const gradient = context.createLinearGradient(0, 0, 0, 64);
            gradient.addColorStop(0, '#cd853f');   // 亮棕
            gradient.addColorStop(0.5, '#deb887'); // 浅黄棕
            gradient.addColorStop(1, '#cd853f');   // 亮棕
            context.fillStyle = gradient;
            context.fillRect(0, 0, 16, 64);
            
            // 添加简单的纹理线条
            context.fillStyle = 'rgba(100, 50, 0, 0.15)';
            for(let i=0; i<64; i+=2) {
                context.fillRect(0, i, 16, 1);
            }
            return new THREE.CanvasTexture(canvas);
        }

        const woodTexture = createWoodTexture();
        woodTexture.wrapS = THREE.RepeatWrapping;
        woodTexture.wrapT = THREE.RepeatWrapping;
        woodTexture.repeat.set(1, 1);

        const batMaterial = new THREE.MeshPhongMaterial({ 
            map: woodTexture,
            specular: 0x222222, // 增加少量高光
            shininess: 30
        });

        // --- 构建棒体几何体 (调整Barrel位置) ---
        // Barrel
        const barrelGeometry = new THREE.CylinderGeometry(0.28, 0.22, 2.8, 32);
        const barrelMesh = new THREE.Mesh(barrelGeometry, batMaterial);
        barrelMesh.position.y = 1.4; 
        baseballBatGroup.add(barrelMesh);

        // Handle
        const handleGeometry = new THREE.CylinderGeometry(0.18, 0.2, 1.2, 32);
        const handleMesh = new THREE.Mesh(handleGeometry, batMaterial);
        handleMesh.position.y = -0.6; 
        baseballBatGroup.add(handleMesh);

        // Cap
        const capGeometry = new THREE.CylinderGeometry(0.22, 0.22, 0.15, 32);
        const capMesh = new THREE.Mesh(capGeometry, batMaterial);
        capMesh.position.y = -1.275;
        baseballBatGroup.add(capMesh);

        baseballBatGroup.children.forEach(child => {
            child.castShadow = true;
            child.receiveShadow = true;
        });

        // --- 质心偏移计算 ---
        const cmOffsetFromTop = 1.0; 
        baseballBatGroup.children.forEach(child => {
            child.position.y -= cmOffsetFromTop; 
        });

        // 2. 强化的发光质心球 (显著放大尺寸)
        const cmGeometry = new THREE.SphereGeometry(0.55, 32, 32); 
        const neonYellowMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xffff00,
            emissive: 0xffff00,
            emissiveIntensity: 1.0 // 移除了透明，改为完全不透明发光
        });
        const cmMesh = new THREE.Mesh(cmGeometry, neonYellowMaterial);
        baseballBatGroup.add(cmMesh);

        // 强化质心 PointLight 的强度和范围
        const cmLight = new THREE.PointLight(0xffff00, 6.0, 20);
        baseballBatGroup.add(cmLight);

        scene.add(baseballBatGroup);

        // --- 轨迹线 (大幅加粗) ---
        const pathPoints = [];
        const pathGeometry = new THREE.BufferGeometry();
        const pathMaterial = new THREE.LineDashedMaterial({ 
            color: 0xff0000, 
            dashSize: 1.5, // 更长的虚线
            gapSize: 0.8,
            linewidth: 4 // 加粗轨迹线，更明显
        });
        const pathLine = new THREE.Line(pathGeometry, pathMaterial);
        scene.add(pathLine);

        // --- 运动参数 (宏大的长抛物线) ---
        let clock = new THREE.Clock();
        let t = 0;
        const v0 = 17;        // 更高的初始速度
        const angle = Math.PI / 4.8; // 38度，寻求最远
        const g = 4.8;        // 较低重力感
        const startX = -30;    // 更远的起点
        let isMoving = true;

        function updatePhysics() {
            if (!isMoving) return;

            const dt = clock.getDelta();
            t += dt * 1.5; // 时间流速调整

            // 长抛物线公式 (质心运动)
            const x = startX + v0 * Math.cos(angle) * t;
            const y = 2.8 + (v0 * Math.sin(angle) * t - 0.5 * g * t * t);
            const z = Math.sin(t * 0.25) * 8; // 显著增加 Z 轴侧向偏移

            // 撞击地面
            if (y < 0.6) {
                isMoving = false;
                // 添加撞击后的 Z 轴倾斜，模拟落地状态
                baseballBatGroup.rotation.z += Math.PI / 3;
                return;
            }

            // 更新位置 (质心随抛物线移动)
            baseballBatGroup.position.set(x, y, z);

            // 更新自转 (棒体绕局部 CM 翻转)
            baseballBatGroup.rotation.z += dt * 6; // 稍微加快旋转，体现紧张感
            baseballBatGroup.rotation.x += dt * 1.8; 

            // 绘制轨迹
            pathPoints.push(new THREE.Vector3(x, y, z));
            pathGeometry.setFromPoints(pathPoints);
            pathLine.computeLineDistances();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // 必须更新 OrbitControls
            updatePhysics();
            renderer.render(scene, camera);
        }

        // 重置函数
        window.resetAnimation = function() {
            t = 0;
            pathPoints.length = 0;
            pathGeometry.setFromPoints([]);
            baseballBatGroup.position.set(startX, 2.8, 0);
            baseballBatGroup.rotation.set(0,0,0);
            isMoving = true;
            clock.start();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 页面加载时自动投掷一次
        resetAnimation();
        animate();
    </script>
</body>
</html>
