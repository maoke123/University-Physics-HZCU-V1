<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>物理模型：平均作用力定量分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background: #f0f2f5; font-family: 'Segoe UI', system-ui; padding: 20px; }
        .container { display: flex; gap: 20px; max-width: 1000px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        canvas#simCanvas { background: #fff; border: 1px solid #ddd; border-radius: 8px; }
        .controls { width: 280px; display: flex; flex-direction: column; gap: 15px; }
        .slider-group { background: #f8f9fa; padding: 15px; border-radius: 10px; }
        label { display: block; font-size: 14px; margin-bottom: 8px; color: #444; font-weight: bold; }
        input[type=range] { width: 100%; cursor: pointer; }
        
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .fire-btn { background: #e74c3c; color: white; }
        .fire-btn:hover { background: #c0392b; }
        .reset-btn { background: #95a5a6; color: white; }
        .reset-btn:hover { background: #7f8c8d; }

        .charts-container { display: flex; gap: 20px; margin-top: 25px; width: 1020px; }
        .chart-box { flex: 1; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); height: 320px; }
        .data-panel { background: #2c3e50; color: #ecf0f1; padding: 12px; border-radius: 8px; margin-top: 15px; font-family: monospace; font-size: 13px; text-align: center; }
        b { color: #3498db; }
    </style>
</head>
<body>

    <h2>子弹穿透实验：瞬时力与平均力</h2>

    <div class="container">
        <div class="canvas-area">
            <canvas id="simCanvas" width="680" height="220"></canvas>
            <div class="data-panel">
                m: <b>0.02kg</b> | v₀: <b id="vInDisp">0</b>m/s | vₜ: <b id="vOutDisp">0</b>m/s | Δp: <b id="dpDisp">0</b>kg·m/s
            </div>
        </div>
        <div class="controls">
            <div class="slider-group">
                <label>初速度 (v₀): <span id="v0Txt" style="color:#e74c3c">400</span> m/s</label>
                <input type="range" id="v0Slider" min="200" max="800" step="10" value="400">
            </div>
            <div class="btn-group">
                <button class="fire-btn" onclick="fire()">发射击穿</button>
                <button class="reset-btn" onclick="resetAll()">重置实验</button>
            </div>
            <p style="font-size: 12px; color: #7f8c8d; line-height: 1.4;">
                说明：由于阻力作用，子弹穿过苹果后动量减小。平均力是使物体产生相同动量变化量的等效恒力。
            </p>
        </div>
    </div>

    <div class="charts-container">
        <div class="chart-box"><canvas id="chart1"></canvas></div>
        <div class="chart-box"><canvas id="chart2"></canvas></div>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    let chart1, chart2;
    let animId;

    const m = 0.02; 
    let bullet = { x: 40, y: 110, v: 0, active: false };
    const apple = { x: 340, y: 110, r: 45 };

    function initCharts() {
        const c1 = document.getElementById('chart1').getContext('2d');
        const c2 = document.getElementById('chart2').getContext('2d');

        const opt = {
            responsive: true, maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, title: { display: true, text: '力 (N)' } }, x: { title: { display: true, text: '时间 (ms)' } } }
        };

        chart1 = new Chart(c1, {
            type: 'line',
            data: { labels: [], datasets: [{ label: '瞬时力 F(t)', data: [], borderColor: '#3498db', backgroundColor: 'rgba(52,152,219,0.1)', fill: true, tension: 0.4 }] },
            options: { ...opt, plugins: { title: { display: true, text: '瞬时作用力曲线' } } }
        });

        chart2 = new Chart(c2, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [
                    { label: '瞬时力', data: [], borderColor: '#3498db', tension: 0.4, borderWidth: 1, pointRadius: 0 },
                    { label: '平均力 F_avg', data: [], borderColor: '#e74c3c', borderDash: [5, 5], pointRadius: 0, borderWidth: 3 }
                ] 
            },
            options: { ...opt, plugins: { title: { display: true, text: '瞬时力 vs 平均力对比' } } }
        });
    }

    function resetAll() {
        cancelAnimationFrame(animId);
        bullet.x = 40;
        bullet.active = false;
        
        // 数据归零
        document.getElementById('vInDisp').innerText = "0";
        document.getElementById('vOutDisp').innerText = "0";
        document.getElementById('dpDisp').innerText = "0";
        
        // 图表清空
        chart1.data.labels = [];
        chart1.data.datasets[0].data = [];
        chart1.update();
        
        chart2.data.labels = [];
        chart2.data.datasets[0].data = [];
        chart2.data.datasets[1].data = [];
        chart2.update();
        
        draw();
    }

    function fire() {
        if(bullet.active) return;
        const v0 = parseFloat(document.getElementById('v0Slider').value);
        bullet.v = v0;
        bullet.active = true;
        
        const dt = (apple.r * 2) / (v0 * 0.75) * 1000; 
        const vOut = v0 * 0.65; 
        const dp = m * (v0 - vOut);
        const avgF = dp / (dt / 1000);

        document.getElementById('vInDisp').innerText = v0;
        document.getElementById('vOutDisp').innerText = vOut.toFixed(0);
        document.getElementById('dpDisp').innerText = dp.toFixed(3);

        updateCharts(dt, avgF);
        animate();
    }

    function updateCharts(duration, avgF) {
        const labels = [];
        const instantF = [];
        const avgFData = [];
        const steps = 30;

        for (let i = 0; i <= steps; i++) {
            const t = (i / steps) * duration;
            labels.push(t.toFixed(2));
            const x = (i - steps / 2) / (steps / 5);
            const f = (avgF * 1.6) * Math.exp(-0.5 * x * x); // 高斯模拟瞬时力
            instantF.push(f);
            avgFData.push(avgF);
        }

        chart1.data.labels = labels;
        chart1.data.datasets[0].data = instantF;
        chart1.update();

        chart2.data.labels = labels;
        chart2.data.datasets[0].data = instantF;
        chart2.data.datasets[1].data = avgFData;
        chart2.update();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 苹果
        ctx.fillStyle = '#ff4d4d';
        ctx.beginPath(); ctx.arc(apple.x, apple.y, apple.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#27ae60'; ctx.fillRect(apple.x-4, apple.y-apple.r-8, 8, 12);

        // 子弹
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(bullet.x, bullet.y - 4, 18, 8);
        if(!bullet.active) {
            ctx.strokeStyle = "rgba(0,0,0,0.1)";
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(bullet.x, bullet.y); ctx.lineTo(canvas.width, bullet.y); ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    function animate() {
        if (!bullet.active) return;
        bullet.x += bullet.v * 0.04; 
        draw();
        if (bullet.x > canvas.width + 20) bullet.active = false;
        else animId = requestAnimationFrame(animate);
    }

    document.getElementById('v0Slider').oninput = function() {
        document.getElementById('v0Txt').innerText = this.value;
    };

    initCharts();
    draw();
</script>
</body>
</html>
