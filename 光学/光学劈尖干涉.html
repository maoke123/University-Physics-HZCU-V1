<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>等厚干涉综合模型：劈尖与牛顿环</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        canvas { background: black; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: crosshair; }
        .controls { background: #333; padding: 15px; border-radius: 8px; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 800px; }
        .control-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-size: 14px; }
        input[type="range"] { width: 100%; }
        select { padding: 5px; background: #444; color: white; border: none; }
        .value-display { font-family: monospace; color: #00ffcc; }
    </style>
</head>
<body>

    <h2>等厚干涉可视化 (劈尖 & 牛顿环)</h2>
    <canvas id="interferenceCanvas"></canvas>

    <div class="controls">
        <div class="control-group">
            <label>实验模式</label>
            <select id="modeSelect">
                <option value="wedge">经典劈尖干涉 (Wedge)</option>
                <option value="rings">牛顿环干涉 (Newton's Rings)</option>
            </select>
            
            <label style="margin-top:10px;">光波频率 (模拟颜色)</label>
            <input type="range" id="freqSlider" min="400" max="750" value="650">
            <span class="value-display">波长: <span id="waveVal">650</span> nm</span>
        </div>

        <div class="control-group">
            <label id="paramLabel">倾斜角 (θ / 曲率)</label>
            <input type="range" id="paramSlider" min="1" max="100" value="20">
            <span class="value-display">强度系数: <span id="paramVal">20</span></span>
            
            <label style="margin-top:10px;">条纹对比度</label>
            <input type="range" id="contrastSlider" min="0.1" max="1" step="0.1" value="0.8">
        </div>
    </div>

<script>
    const canvas = document.getElementById('interferenceCanvas');
    const ctx = canvas.getContext('2d');
    const modeSelect = document.getElementById('modeSelect');
    const freqSlider = document.getElementById('freqSlider');
    const paramSlider = document.getElementById('paramSlider');
    const contrastSlider = document.getElementById('contrastSlider');

    canvas.width = 800;
    canvas.height = 400;

    // 波长转RGB色彩的近似函数
    function nmToRGB(wavelength) {
        let r, g, b;
        if (wavelength >= 380 && wavelength < 440) { r = -(wavelength - 440) / (440 - 380); g = 0; b = 1; }
        else if (wavelength >= 440 && wavelength < 490) { r = 0; g = (wavelength - 440) / (490 - 440); b = 1; }
        else if (wavelength >= 490 && wavelength < 510) { r = 0; g = 1; b = -(wavelength - 510) / (510 - 490); }
        else if (wavelength >= 510 && wavelength < 580) { r = (wavelength - 510) / (580 - 510); g = 1; b = 0; }
        else if (wavelength >= 580 && wavelength < 645) { r = 1; g = -(wavelength - 645) / (645 - 580); b = 0; }
        else if (wavelength >= 645 && wavelength <= 780) { r = 1; g = 0; b = 0; }
        else { r = 0; g = 0; b = 0; }
        return { r: r * 255, g: g * 255, b: b * 255 };
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const mode = modeSelect.value;
        const wavelength = parseFloat(freqSlider.value);
        const param = parseFloat(paramSlider.value);
        const contrast = parseFloat(contrastSlider.value);
        const color = nmToRGB(wavelength);
        
        document.getElementById('waveVal').innerText = wavelength;
        document.getElementById('paramVal').innerText = param;
        document.getElementById('paramLabel').innerText = mode === 'wedge' ? "劈尖倾斜角 (α)" : "透镜曲率半径 (R反比)";

        const imgData = ctx.createImageData(canvas.width, canvas.height);
        const data = imgData.data;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        for (let x = 0; x < canvas.width; x++) {
            for (let y = 0; y < canvas.height; y++) {
                let intensity = 0;
                let d = 0; // 空气层厚度

                if (mode === 'wedge') {
                    // 劈尖公式: d = x * tan(α)
                    d = x * (param / 2000);
                } else {
                    // 牛顿环公式: d = r^2 / 2R
                    const dx = x - centerX;
                    const dy = y - centerY;
                    const rSquared = dx * dx + dy * dy;
                    d = rSquared * (param / 100000);
                }

                // 相干叠加强度公式: I = 2I0(1 + cos(delta))
                // 光程差 delta = 2*d + lambda/2 (加上半波损失)
                const phase = (4 * Math.PI * d) / (wavelength * 0.01) + Math.PI;
                intensity = 0.5 * (1 + Math.cos(phase)) * contrast;

                const index = (y * canvas.width + x) * 4;
                data[index] = color.r * intensity;     // R
                data[index + 1] = color.g * intensity; // G
                data[index + 2] = color.b * intensity; // B
                data[index + 3] = 255;                 // A
            }
        }
        ctx.putImageData(imgData, 0, 0);
        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
